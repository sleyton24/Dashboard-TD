# JARVIS — reverse proxy en puerto 8080 (HTTP, sin TLS por ahora).
#
# Upstream: uvicorn en 127.0.0.1:8002 (el 8000 está ocupado por el backend
# Docker del Panel TD que también vive en este VPS).
#
# Cuando se asigne dominio + cert (Fase H final):
#   - Cambiar `listen 8080;` por `listen 443 ssl http2;`
#   - Agregar bloque `server_name jarvis.sanvest.cl;`
#   - Agregar `ssl_certificate` / `ssl_certificate_key` (certbot/letsencrypt)
#   - Agregar redirect 80 → 443

server {
    listen 8080;
    server_name _;

    # Logs separados — útil para debug aislado de JARVIS
    access_log /var/log/nginx/jarvis-access.log;
    error_log  /var/log/nginx/jarvis-error.log;

    # Tope para uploads de archivos (Excel/PDF que el agente pueda procesar)
    client_max_body_size 25m;

    # SSE necesita proxy_buffering off y timeout largo
    location /api/v1/jobs/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
