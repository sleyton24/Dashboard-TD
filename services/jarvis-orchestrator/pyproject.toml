[project]
name = "jarvis-orch"
version = "0.1.0"
description = "JARVIS — Orquestador de agentes financieros para Grupo Sanvest"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "structlog>=24.4",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "msal>=1.31",
    "sqlparse>=0.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_orch"]
